<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1214"><style>    :root {
      --canvas: #0f172a;
      --boundary-stroke: #cbd5e1;
      --boundary-label: #94a3b8;
      --person-fill: #0284c7;
      --person-accent: #0ea5e9;
      --focal-fill: #1e3a8a;
      --focal-stroke: #3b82f6;
      --supporting-fill: #2a3c66;
      --supporting-stroke: #4763a5;
      --external-fill: #334155;
      --external-stroke: #64748b;
      --datastore-accent: #3b82f6;
      --datastore-rim: #dbeafe;
      --line: #cbd5e1;
      --label-text: #cbd5e1;
      --title-text: #f8fafc;
      --on-element: #f8fafc;
      --panel-fill: #111c34;
      --panel-stroke: #334155;
      --panel-label: #e2e8f0;
      --note-fill: #fef9c3;
      --note-fold: #fde68a;
      --note-stroke: #ca8a04;
      --note-ink: #422006;
      --boundary-stroke-opacity: 0.5;
      --shadow: rgba(0, 0, 0, 0.3);
      --shadow-subtle: rgba(0, 0, 0, 0.35);
    }
    :root[data-theme="light"] {
      --canvas: #f8fafc;
      --boundary-stroke: #334155;
      --boundary-stroke-opacity: 0.7;
      --boundary-label: #475569;
      --person-fill: #0c4a6e;
      --person-accent: #0369a1;
      --focal-fill: #1e40af;
      --focal-stroke: #1e3a8a;
      --supporting-fill: #33518c;
      --supporting-stroke: #24406f;
      --external-fill: #475569;
      --external-stroke: #334155;
      --datastore-accent: #2563eb;
      --datastore-rim: #dbeafe;
      --line: #64748b;
      --label-text: #334155;
      --title-text: #0f172a;
      --on-element: #f8fafc;
      --panel-fill: #ffffff;
      --panel-stroke: #cbd5e1;
      --panel-label: #334155;
      --note-fill: #fef9c3;
      --note-fold: #fde68a;
      --note-stroke: #a16207;
      --note-ink: #422006;
      --shadow: rgba(15, 23, 42, 0.12);
      --shadow-subtle: rgba(15, 23, 42, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--canvas);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #diagram-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 100%;
      height: 100%;
      user-select: none;
    }
    .canvas {
      fill: var(--canvas);
    }
    .boundary {
      fill: transparent;
      stroke: var(--boundary-stroke);
      stroke-opacity: var(--boundary-stroke-opacity);
      stroke-width: 3px;
      stroke-dasharray: 8, 8;
      rx: 8;
    }
    .boundary-label {
      fill: var(--boundary-label);
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .node {
      filter: drop-shadow(0 4px 6px var(--shadow));
      stroke-width: 2px;
      rx: 6;
    }
    .node-person {
      fill: var(--person-fill);
      stroke: var(--person-accent);
    }
    .person-head {
      fill: var(--person-accent);
      stroke: none;
    }
    .node-container {
      fill: var(--focal-fill);
      stroke: var(--focal-stroke);
    }
    .node-supporting {
      fill: var(--supporting-fill);
      stroke: var(--supporting-stroke);
    }
    .node-external {
      fill: var(--external-fill);
      stroke: var(--external-stroke);
    }
    .node-database {
      fill: var(--focal-fill);
      stroke: var(--focal-stroke);
    }
    .db-cap {
      fill: var(--datastore-accent);
      stroke: none;
    }
    .db-rim {
      fill: none;
      stroke: var(--datastore-rim);
      stroke-width: 2.5px;
      stroke-linecap: round;
    }
    .node-message-bus {
      fill: var(--focal-fill);
      stroke: var(--focal-stroke);
    }
    .message-bus-cap {
      fill: var(--datastore-accent);
      stroke: var(--focal-fill);
      stroke-width: 2px;
    }
    .edge-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.8px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6, 6;
      transition: stroke 0.2s;
    }
    .arrow-head {
      fill: var(--line);
    }
    .edge-label-bg {
      fill: var(--canvas);
      rx: 4;
    }
    .edge-label-text {
      fill: var(--label-text);
      font-size: 11px;
      font-weight: 500;
      text-anchor: middle;
    }
    .diagram-title-text {
      fill: var(--title-text);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.025em;
    }
    .legend-panel {
      fill: var(--panel-fill);
      stroke: var(--panel-stroke);
      stroke-width: 1px;
      rx: 8;
    }
    .legend-label {
      fill: var(--panel-label);
      font-size: 13px;
      font-weight: 500;
    }
    .legend-icon .node {
      filter: drop-shadow(0 1px 1px var(--shadow-subtle));
      stroke-width: 1.25px;
    }
    .legend-icon .message-bus-cap {
      stroke-width: 1px;
    }
    .note {
      fill: var(--note-fill);
      stroke: var(--note-stroke);
      stroke-width: 1.5px;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 3px var(--shadow));
    }
    .note-fold {
      fill: var(--note-fold);
      stroke: var(--note-stroke);
      stroke-width: 1.5px;
      stroke-linejoin: round;
    }
    .note-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      color: var(--note-ink);
      font-size: 12px;
      line-height: 1.25;
      text-align: left;
      overflow: hidden;
    }
    .node-content-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4px 8px;
      box-sizing: border-box;
      color: var(--on-element);
      text-align: center;
    }
    .node-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 2px;
      line-height: 1.2;
    }
    .node-type {
      font-size: 10px;
      font-weight: 600;
      opacity: 0.7;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }
    .node-tech {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 9px;
      opacity: 0.7;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .node-desc {
      font-size: 11px;
      opacity: 0.85;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
@media (prefers-color-scheme: light){:root:not([data-theme]){--canvas: #f8fafc; --boundary-stroke: #334155; --boundary-stroke-opacity: 0.7; --boundary-label: #475569; --person-fill: #0c4a6e; --person-accent: #0369a1; --focal-fill: #1e40af; --focal-stroke: #1e3a8a; --supporting-fill: #33518c; --supporting-stroke: #24406f; --external-fill: #475569; --external-stroke: #334155; --datastore-accent: #2563eb; --datastore-rim: #dbeafe; --line: #64748b; --label-text: #334155; --title-text: #0f172a; --on-element: #f8fafc; --panel-fill: #ffffff; --panel-stroke: #cbd5e1; --panel-label: #334155; --note-fill: #fef9c3; --note-fold: #fde68a; --note-stroke: #a16207; --note-ink: #422006; --shadow: rgba(15, 23, 42, 0.12); --shadow-subtle: rgba(15, 23, 42, 0.1);}}</style>
      <defs>
        <!-- Arrowhead markers -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
          <path d="M 0 1.5 L 9 5 L 0 8.5 z" class="arrow-head"></path>
        </marker>
      </defs>
